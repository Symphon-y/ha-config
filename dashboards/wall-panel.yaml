# Wall Panel — the tablet dashboard.
#
# One view per deck page. The kiosk app swipes between views with a two-finger
# gesture, so nothing here may depend on Home Assistant's tab bar.
#
# Laid out for 1280x800 CSS px landscape: three columns, filled edge to edge.
# The previous dashboard used a single section, which is why half the panel was
# empty in portrait.

views:
  # ---------------------------------------------------------------------------
  # HOME — glanceable from across the room.
  #
  # Focal point: the house-state line. Everything else is demoted beneath it.
  # ---------------------------------------------------------------------------
  - title: Home
    path: home
    theme: Wall Panel
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      # --- Column 1: what the house is doing right now ------------------------
      - type: grid
        column_span: 1
        cards:
          # The hero. Read at six feet: how many lamps are burning, how warm it
          # is, whether anyone is in. Counts, not a list — a list would need
          # reading, and this needs glancing.
          # Time and house state. No strftime padding modifiers (%-I, %-d): those are
          # glibc extensions and Home Assistant OS runs musl, where they raise.
          - type: markdown
            content: >
              {% set h = now().hour % 12 %}
              {% set on = states.light | selectattr('state','eq','on') | list | count %}
              {% set home = [states('person.travis'), states('person.star')]
                   | select('eq','home') | list | count %}
              {% set t = states('sensor.downstairs_temperature') %}

              # {{ h if h else 12 }}:{{ '%02d' % now().minute }}

              **{{ now().strftime('%A') }}** · {{ now().day }} {{ now().strftime('%B') }}

              ### {{ on }} {{ 'light' if on == 1 else 'lights' }} on

              {% if t not in ['unknown','unavailable','none'] %}{{ t | float(0) | round(0) }}°F
              downstairs · {% endif %}{{ home }} of 2 home

          - type: heading
            heading: Climate
            heading_style: subtitle
            icon: mdi:thermometer

          - type: tile
            entity: climate.downstairs
            name: Downstairs
            features:
              - type: target-temperature
              - type: climate-hvac-modes
                hvac_modes:
                  - heat
                  - cool
                  - "off"

          - type: heading
            heading: Home
            heading_style: subtitle
            icon: mdi:account-group

          # Presence earns its place: it is the one thing on this panel that
          # changes what you would do next.
          - type: tile
            entity: person.travis
            name: Travis

          - type: tile
            entity: person.star
            name: Star

          - type: heading
            heading: Television
            heading_style: subtitle
            icon: mdi:television-classic

          - type: button
            name: Art Mode
            icon: mdi:brush
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.harmony_hub_activities
              data:
                option: Art Mode

          - type: button
            name: Wake
            icon: mdi:television-shimmer
            grid_options:
              columns: 6
            tap_action:
              action: call-service
              service: remote.send_command
              target:
                entity_id: remote.harmony_hub
              data:
                device: Samsung TV
                command: PowerOn

          - type: button
            name: Power off
            icon: mdi:power
            grid_options:
              columns: 6
            tap_action:
              action: call-service
              service: select.select_option
              target:
                entity_id: select.harmony_hub_activities
              data:
                option: power_off

          # A nested grid pins the 3x3. Per-card grid_options let these reflow with the
          # column, so the arrows never formed a cross around OK.
          - type: grid
            columns: 3
            square: true
            cards:
              - type: button
                icon: mdi:keyboard-return
                show_name: false
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.harmony_hub
                  data:
                    device: Samsung TV
                    command: Return
              - type: button
                icon: mdi:chevron-up
                show_name: false
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.harmony_hub
                  data:
                    device: Samsung TV
                    command: DirectionUp
              - type: button
                icon: mdi:home
                show_name: false
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.harmony_hub
                  data:
                    device: Samsung TV
                    command: Home
              - type: button
                icon: mdi:chevron-left
                show_name: false
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.harmony_hub
                  data:
                    device: Samsung TV
                    command: DirectionLeft
              - type: button
                icon: mdi:circle-slice-8
                show_name: false
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.harmony_hub
                  data:
                    device: Samsung TV
                    command: Select
              - type: button
                icon: mdi:chevron-right
                show_name: false
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.harmony_hub
                  data:
                    device: Samsung TV
                    command: DirectionRight
              - type: button
                icon: mdi:volume-minus
                show_name: false
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.harmony_hub
                  data:
                    device: Samsung TV
                    command: VolumeDown
              - type: button
                icon: mdi:chevron-down
                show_name: false
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.harmony_hub
                  data:
                    device: Samsung TV
                    command: DirectionDown
              - type: button
                icon: mdi:volume-plus
                show_name: false
                tap_action:
                  action: call-service
                  service: remote.send_command
                  target:
                    entity_id: remote.harmony_hub
                  data:
                    device: Samsung TV
                    command: VolumeUp

          - type: button
            name: Mute
            icon: mdi:volume-mute
            grid_options:
              columns: 12
            tap_action:
              action: call-service
              service: remote.send_command
              target:
                entity_id: remote.harmony_hub
              data:
                device: Samsung TV
                command: Mute

      # --- Column 2: the lamps, by name --------------------------------------
      # Named objects, not devices. "Travis lamp" and "Stars lamp" are things in
      # rooms; light.tp_link_smart_bulb_694f is not. Amber icon means burning.
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Lighting
            heading_style: subtitle
            icon: mdi:lightbulb-group-outline

          - type: heading
            heading: Living Room
            heading_style: subtitle

          - type: tile
            entity: light.living_room
            name: Living Room
            features:
              - type: light-brightness

          - type: tile
            entity: light.fireplace
            name: Fireplace
            features:
              - type: light-brightness

          - type: heading
            heading: Bedroom
            heading_style: subtitle

          - type: tile
            entity: light.bedroom
            name: Bedroom
            features:
              - type: light-brightness

          - type: tile
            entity: light.floor_lamp
            name: Floor Lamp
            features:
              - type: light-brightness

          - type: tile
            entity: light.stars_lamp
            name: Stars Lamp
            features:
              - type: light-brightness

          - type: tile
            entity: light.desk_light
            name: Desk
            features:
              - type: light-brightness

          - type: tile
            entity: light.bookshelf_light
            name: Bookshelf
            features:
              - type: light-brightness

      # --- Column 3: outside, and the mead -----------------------------------
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Outside
            heading_style: subtitle
            icon: mdi:cctv

          - type: picture-entity
            entity: camera.front_door_live_view
            camera_image: camera.front_door_live_view
            camera_view: live
            fit_mode: contain
            show_name: false
            show_state: false
            visibility:
              - condition: state
                entity: input_select.wall_panel_camera
                state: Front Door

          - type: picture-entity
            entity: camera.front_drive_garage_live_view
            camera_image: camera.front_drive_garage_live_view
            camera_view: live
            fit_mode: contain
            show_name: false
            show_state: false
            visibility:
              - condition: state
                entity: input_select.wall_panel_camera
                state: Garage

          - type: picture-entity
            entity: camera.side_drive_live_view
            camera_image: camera.side_drive_live_view
            camera_view: live
            fit_mode: contain
            show_name: false
            show_state: false
            visibility:
              - condition: state
                entity: input_select.wall_panel_camera
                state: Side Drive

          - type: picture-entity
            entity: camera.back_yard_live_view
            camera_image: camera.back_yard_live_view
            camera_view: live
            fit_mode: contain
            show_name: false
            show_state: false
            visibility:
              - condition: state
                entity: input_select.wall_panel_camera
                state: Back Yard

          - type: tile
            entity: input_select.wall_panel_camera
            name: Camera
            icon: mdi:cctv
            features:
              - type: select-options

          - type: tile
            entity: weather.forecast_home
            name: Weather

          - type: heading
            heading: Fermenting
            heading_style: subtitle
            icon: mdi:glass-mug-variant
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.hivemind_tilt_black_specific_gravity
                    state_not: unknown
                  - condition: state
                    entity: sensor.hivemind_tilt_pink_specific_gravity
                    state_not: unknown
                  - condition: state
                    entity: sensor.hivemind_tilt_red_specific_gravity
                    state_not: unknown

          - type: tile
            entity: sensor.hivemind_tilt_black_specific_gravity
            name: Tilt Black
            icon: mdi:circle-outline
            visibility:
              - condition: state
                entity: sensor.hivemind_tilt_black_specific_gravity
                state_not: unknown
              - condition: state
                entity: sensor.hivemind_tilt_black_specific_gravity
                state_not: unavailable

          - type: tile
            entity: sensor.hivemind_tilt_pink_specific_gravity
            name: Tilt Pink
            icon: mdi:circle-outline
            visibility:
              - condition: state
                entity: sensor.hivemind_tilt_pink_specific_gravity
                state_not: unknown
              - condition: state
                entity: sensor.hivemind_tilt_pink_specific_gravity
                state_not: unavailable

          - type: tile
            entity: sensor.hivemind_tilt_red_specific_gravity
            name: Tilt Red
            icon: mdi:circle-outline
            visibility:
              - condition: state
                entity: sensor.hivemind_tilt_red_specific_gravity
                state_not: unknown
              - condition: state
                entity: sensor.hivemind_tilt_red_specific_gravity
                state_not: unavailable

          - type: heading
            heading: Outdoor
            heading_style: subtitle
            icon: mdi:outdoor-lamp

          - type: tile
            entity: light.driveway
            name: Driveway

          - type: tile
            entity: light.back_yard_light
            name: Back Yard
