        {% else %}
          unknown
        {% endif %}

    - name: "Pink Mead ABV"
      unique_id: mead_pink_abv
      unit_of_measurement: "%"
      state_class: measurement
      state: >
        {% set og = states('input_number.mead_pink_og') | float(0) %}
        {% set sg = states('sensor.hivemind_tilt_pink_specific_gravity') | float(0) %}
        {% if og > 0 and sg > 0 and sg <= og %}
          {{ ((og - sg) * 131.25) | round(2) }}
        {% else %}
          unknown
        {% endif %}
